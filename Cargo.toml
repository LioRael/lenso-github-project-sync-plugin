[workspace]
resolver = "2"
members = [
    "crates/lenso-capability-github-project-sync",
    "crates/lenso-capability-github-project-sync-admin",
    "crates/lenso-github-project-sync-postgres-plugin",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/LioRael/lenso-github-project-sync-plugin"
rust-version = "1.94"

[workspace.dependencies]
base64 = "0.22"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
jsonwebtoken = { version = "10.3", default-features = false, features = ["rust_crypto", "use_pem"] }
lenso = { version = "0.5.0", git = "https://github.com/LioRael/lenso-runtime-rust", rev = "b763a63adc20f1ccc9955e784c0d04c21489126b" }
lenso-capability-http-client = { version = "0.2.3", git = "https://github.com/LioRael/lenso-web", rev = "d3fa8b27c3dea470fcbf72183a7cca1fc032a117" }
lenso-capability-projects = { version = "0.1.0", git = "https://github.com/LioRael/lenso-projects-plugin", rev = "583218c04e2b6a71b2e79ceecec4b501b5fb4e89" }
lenso-capability-projects-collaboration = { version = "0.1.0", git = "https://github.com/LioRael/lenso-projects-plugin", rev = "583218c04e2b6a71b2e79ceecec4b501b5fb4e89" }
lenso-capability-secrets = { version = "0.1.1", git = "https://github.com/LioRael/lenso-secrets-plugin", rev = "c31aa142ff59b4536e2bf3e9785ccbb5bb5c0e6a" }
lenso-contract-codegen = { version = "0.6.3", git = "https://github.com/LioRael/lenso-protocols", rev = "9769bc5dc828fd9111da6d28a4ecd5f1bb198ab4" }
lenso-contract-runtime = { version = "0.1.3", git = "https://github.com/LioRael/lenso-protocols", rev = "9769bc5dc828fd9111da6d28a4ecd5f1bb198ab4" }
lenso-kernel = { version = "0.2.0", git = "https://github.com/LioRael/lenso", rev = "cd35675a191d815b690c8889756dfe859a0e4d7b" }
lenso-plugin-authoring = { version = "0.1.1", git = "https://github.com/LioRael/lenso-protocols", rev = "9769bc5dc828fd9111da6d28a4ecd5f1bb198ab4" }
lenso-postgres-kit = { version = "0.1.0", git = "https://github.com/LioRael/lenso-postgres-kit", rev = "97ff73638d1fca098034c443539d44d95062eea4" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "json", "time", "uuid"] }
subtle = "2.6"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.52", features = ["macros", "rt"] }
uuid = { version = "1.18", features = ["v4", "v5"] }
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
