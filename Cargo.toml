[workspace]
resolver = "2"
members = [
    "crates/lenso-capability-github-project-sync",
    "crates/lenso-capability-github-project-sync-admin",
    "crates/lenso-github-project-sync-postgres-plugin",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/LioRael/lenso-github-project-sync-plugin"
rust-version = "1.94"

[workspace.dependencies]
base64 = "0.22"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
jsonwebtoken = { version = "10.3", default-features = false, features = ["rust_crypto", "use_pem"] }
lenso = { version = "0.5.0" }
lenso-capability-http-client = { version = "0.2.3" }
lenso-capability-projects = { version = "0.1.0" }
lenso-capability-projects-collaboration = { version = "0.1.0" }
lenso-capability-secrets = { version = "0.1.1" }
lenso-contract-runtime = { version = "0.1.3" }
lenso-kernel = { version = "0.2.0" }
lenso-plugin-authoring = { version = "0.1.1" }
lenso-postgres-kit = { version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "json", "time", "uuid"] }
subtle = "2.6"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.52", features = ["macros", "rt"] }
uuid = { version = "1.18", features = ["v4", "v5"] }
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
