name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: lenso_github_sync_test_ci
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lenso_github_sync_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install repository boundary tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: ./scripts/check-repository-boundary.sh
      - name: PostgreSQL restart, duplicate, ordering, concurrency, fencing, and cursor acceptance
        env:
          LENSO_GITHUB_SYNC_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/lenso_github_sync_test_ci
        run: >-
          cargo test --locked -p lenso-github-project-sync-postgres-plugin
          --features postgres-acceptance
          postgres_tests::restart_duplicate_out_of_order_concurrency_fencing_and_cursor_no_skip
          -- --nocapture
